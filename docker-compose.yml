services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duplikate
      POSTGRES_PASSWORD: duplikate
      POSTGRES_DB: duplikate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duplikate"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    env_file:
      - path: .env
        required: false
    environment:
      # Override the DB host so it points at the compose service
      DATABASE_URL: postgres://duplikate:duplikate@db:5432/duplikate
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
