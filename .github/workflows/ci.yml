name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q

  extension:
    name: Extension (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json
      - run: npm ci
      - name: Type-check (lint)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Package extension zip
        run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: duplikate-extension
          path: chrome-extension/duplikate-extension.zip
